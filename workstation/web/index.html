<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>论文工作站 · 开发验证核心</title>
<style>
:root{--ink:#293247;--accent:#6756b9;--line:#e4e5ee}*{box-sizing:border-box}body{margin:0;background:#f4f5fa;color:var(--ink);font:14px/1.7 system-ui,"Microsoft YaHei",sans-serif}main{max-width:1300px;margin:auto;padding:28px}h1{font-size:28px;margin:8px 0}h2{font-size:18px}p{color:#6d7488}.tag{color:var(--accent);letter-spacing:2px;font-size:11px}.notice{padding:15px 20px;background:#eeebf8;border-left:4px solid var(--accent);border-radius:9px;margin:18px 0}.grid{display:grid;grid-template-columns:280px 1fr;gap:20px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:15px}button,a.button{border:1px solid var(--line);background:white;color:var(--ink);padding:8px 12px;border-radius:7px;cursor:pointer;font:inherit;text-decoration:none;display:inline-block;margin:3px}.primary{background:var(--accent);color:white}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:7px;padding:9px;font:inherit;margin:6px 0}textarea{min-height:90px}pre{font:12px/1.6 ui-monospace,monospace;background:#f6f7fb;padding:12px;overflow:auto;white-space:pre-wrap;word-break:break-word}.row{border-bottom:1px solid var(--line);padding:12px 0}.badge{background:#eeebf8;color:#62518d;border-radius:15px;padding:3px 10px;font-size:12px}.ok{background:#e5f5ee;color:#29785b}.warn{background:#fff0de;color:#9d6c35}.small{font-size:12px;color:#7d8394}.actions{display:flex;flex-wrap:wrap;gap:3px}#alert{position:sticky;top:0;color:#9a4b49;background:#fff0ef;padding:10px;display:none}details{margin:10px 0}summary{cursor:pointer}a{color:var(--accent)}@media(max-width:800px){main{padding:15px}.grid{grid-template-columns:1fr}h1{font-size:24px}}
</style><main><div id="alert" role="alert"></div><span class="tag">THESIS / DURABLE CONTROL PLANE · DEVELOPMENT 0.1</span><h1>项目黑板 · 真文件 · 可恢复任务</h1><p>资源融合方案开始进入开发验证：一个持久化中心，按能力调用外部工具。</p>
<div class="notice">此页连接真实本地API、SQLite和文件目录。输入登记、任务执行、哈希、关卡与恢复是真实程序行为；审查报告由你人工登记，尚未连接真实审查Agent。这里不会生成毕设论文或发送手机消息。</div>
<div class="grid"><aside><div class="card"><h2>执行机与能力</h2><div id="health">加载…</div></div><div class="card"><h2>项目</h2><div id="projects"></div><label>新项目题目<input id="newTitle" value="工具链验证课题"></label><label>要求 / 材料状态<textarea id="requirements">登记输入、核对真实文件、绘制架构并记录审核；这是开发验证样例。</textarea></label><button class="primary" id="createProject">建立独立项目</button></div><div class="card"><h2>已整理资源</h2><div id="resources"></div><details><summary>岗位模型绑定</summary><pre id="bindings"></pre></details></div></aside>
<section><div id="empty" class="card">先建立或选择项目。操作与文件保存在本机，刷新可继续。</div><div id="workspace"></div></section></div></main>
<script>
let current=localStorage.getItem('thesis-runtime-project')||'', snapshot=null, health=null;
const E=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function api(path,body){let r=await fetch('/api'+path,body===undefined?{}:{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let x=await r.json();if(!r.ok)throw Error(x.detail||'请求失败');return x}
async function action(fn){try{document.getElementById('alert').style.display='none';await fn();await refresh()}catch(e){let a=document.getElementById('alert');a.textContent=e.message;a.style.display='block'}}
async function refresh(){health=await api('/health');document.getElementById('health').innerHTML='<b>'+E(health.worker_id)+'</b><br><span class="small">唯一状态：workstation-core</span>'+Object.entries(health.capabilities).map(([k,v])=>'<div class="row"><span class="badge '+(v.ready?'ok':'warn')+'">'+(v.ready?'就绪':'待接入')+'</span> '+E(k)+'</div>').join('');let ps=await api('/projects');document.getElementById('projects').innerHTML=ps.map(p=>'<button data-project="'+E(p.id)+'">'+E(p.title)+'</button>').join('');if(current&&!ps.some(p=>p.id===current))current='';if(current){snapshot=await api('/projects/'+current);render()}document.getElementById('empty').hidden=!!current}
function render(){let p=snapshot.project;document.getElementById('workspace').innerHTML=`<div class="card"><span class="tag">${E(p.worker_id)} / PLAN v${p.version}</span><h2>${E(p.title)}</h2><p>方案状态：${p.approved_version===p.version?'已确认':'待确认'}；资料与API凭据不会发布到GitHub。</p><div class="actions"><button id="approve" class="primary">确认当前方案</button><button id="seedTasks">建立验证任务链</button><button id="accept">验收有效文件版本</button><button id="outbox">导出Issue待同步清单</button></div><details><summary>需求黑板与版本</summary><pre>${E(JSON.stringify(p.requirements,null,2))}</pre><textarea id="revision" placeholder="输入新的任务要求；实质修改生成新方案并重新确认"></textarea><button id="revise">保存新方案</button></details></div><div class="card"><h2>任务与审查关卡</h2><p class="small">输入清单 → 固定版本Archify。上游通过两类独立报告后才允许下一步；报告登记不会自动调用模型。</p>${snapshot.tasks.map(t=>`<div class="row"><b>${E(t.node)}</b> <span class="badge">${E(t.status)}</span><div class="small">${E(t.role)} · ${E(t.kind)} · generation ${t.generation} · 审查轮次 ${t.review_round}/2</div><div class="actions"><button data-dispatch="${t.id}">派发</button><button data-review="${t.id}" data-dimension="engineering_quality">登记工程质量审查</button><button data-review="${t.id}" data-dimension="original_goal_alignment">登记目标一致性审查</button><button data-resume="${t.id}">人工恢复/局部补丁</button><button data-invalidate="${t.id}">变更后标依赖过期</button></div>${t.error?'<p>'+E(t.error)+'</p>':''}</div>`).join('')||'还没有任务。'}</div><div class="card"><h2>真实文件库</h2>${snapshot.artifacts.map(a=>`<div class="row"><a class="button" href="/api/artifacts/${a.id}/download">下载 ${E(a.name)}</a><span class="badge ${a.stale?'warn':'ok'}">${a.stale?'历史/过期':'当前版本'}</span><span class="small">${a.bytes} bytes · ${E(a.sha256.slice(0,14))}…</span></div>`).join('')||'实际运行后显示文件与SHA-256。'}</div><div class="card"><h2>工程决策与待处理</h2><textarea id="decisionText" placeholder="记录当前方案采用理由与否决方案"></textarea><button id="decision">保存决定</button><details><summary>已保存决定 · ${snapshot.decisions.length}</summary><pre>${E(JSON.stringify(snapshot.decisions,null,2))}</pre></details><details open><summary>Issue分级与本机待处理 · ${snapshot.issues.length}</summary><pre>${E(JSON.stringify(snapshot.issues,null,2))}</pre></details></div><div class="card"><h2>持久化事件</h2><pre>${E(snapshot.events.slice(-12).map(e=>e.seq+' '+e.kind+' '+JSON.stringify(e.body)).join('\n'))}</pre></div>`}
function download(name,x){let a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(x,null,2)],{type:'application/json'}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
document.getElementById('createProject').onclick=()=>action(async()=>{let x=await api('/projects',{title:document.getElementById('newTitle').value,requirements:{text:document.getElementById('requirements').value,source_status:'user_entered_development_sample'}});current=x.project.id;localStorage.setItem('thesis-runtime-project',current)});
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;if(b.dataset.project){current=b.dataset.project;localStorage.setItem('thesis-runtime-project',current);action(refresh)}else if(b.id==='approve')action(()=>api('/projects/'+current+'/approve',{version:snapshot.project.version,plan_hash:snapshot.project.plan_hash}));else if(b.id==='seedTasks')action(async()=>{if(snapshot.tasks.length)throw Error('验证任务链已存在；避免重复创建。');let x=await api('/projects/'+current+'/tasks',{node:'输入清单',kind:'source_manifest',role:'R009'});await api('/projects/'+current+'/tasks',{node:'系统架构出图',kind:'architecture_render',role:'R028',dependencies:[x.task_id]})});else if(b.dataset.dispatch)action(()=>api('/tasks/'+b.dataset.dispatch+'/dispatch',{}));else if(b.dataset.review)action(async()=>{let scope=await api('/tasks/'+b.dataset.review+'/review-scope');let id=prompt('登记独立审查成员身份（作者：'+scope.author+'；两类审查需不同成员）',b.dataset.dimension==='engineering_quality'?'quality-reviewer':'goal-reviewer');if(!id)return;let level=prompt('本次结果：PASS / P0 / P1 / P2 / BLOCKED','PASS');if(!level)return;level=level.toUpperCase();if(!['PASS','P0','P1','P2','BLOCKED'].includes(level))throw Error('请输入明确结果。');let findings=[];if(['P0','P1','P2'].includes(level)){let locator=prompt('精确位置（文件/段落/测试）','source-manifest.json');let message=prompt('具体缺陷或建议','请核对交付要求');if(!locator||!message)return;findings=[{severity:level,locator,message}]}await api('/tasks/'+b.dataset.review+'/reviews',{...scope,dimension:b.dataset.dimension,reviewer:id,verdict:level==='P0'?'failed':level==='BLOCKED'?'blocked':'passed',findings})});else if(b.dataset.resume)action(async()=>{let t=snapshot.tasks.find(t=>t.id===b.dataset.resume);let reason=prompt('记录已完成的修复或局部补丁；恢复不会自动派发');if(reason)await api('/tasks/'+t.id+'/resume',{reason,patch:t.status==='needs_patch',old_process_checked:confirm('确认已核对原工具进程/软件会话，没有仍在执行的旧任务？')})});else if(b.dataset.invalidate)action(async()=>{let reason=prompt('记录真实变更来源：受影响任务及下游重新检查');if(reason)await api('/tasks/'+b.dataset.invalidate+'/invalidate',{reason})});else if(b.id==='accept')action(async()=>{let x=await api('/projects/'+current+'/accept',{});download('acceptance-manifest.json',x)});else if(b.id==='outbox')action(async()=>download('github-issue-outbox.json',await api('/projects/'+current+'/issue-outbox')));else if(b.id==='revise')action(()=>api('/projects/'+current+'/revise',{requirements:{text:document.getElementById('revision').value,source_status:'user_revised'},reason:'用户在需求黑板修订'}));else if(b.id==='decision')action(()=>api('/projects/'+current+'/decisions',{background:document.getElementById('decisionText').value,alternatives:['保持当前方案','调整后新方案'],selected:'待实际判断',constraints:['按当前确认版本执行'],rejected_reasons:['由用户记录，尚无自动决策']}))});
async function init(){await refresh();let r=await api('/resources');document.getElementById('resources').innerHTML='<b>'+r.source_count+' 条111资源 · '+r.blueprints.length+'套组合</b><p class="small">'+r.blueprints.map(x=>E(x.name||x.title||x.id)).join(' / ')+'</p>';document.getElementById('bindings').textContent=JSON.stringify(await api('/model-bindings'),null,2)}
action(init);setInterval(()=>{if(current&&snapshot?.tasks.some(t=>t.status==='running'))action(refresh)},2000);
</script></html>
