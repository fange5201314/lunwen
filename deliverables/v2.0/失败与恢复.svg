<svg viewBox="0 0 960 1140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="两类失败：API有限切换，业务人工恢复"><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L7,3 L0,6" fill="#9d91b7"/></marker></defs><g fill="none" stroke="#b5a9ca" stroke-width="1.4" marker-end="url(#arrow)"><path d="M480.0,100 V135.0 H210.0 V170"/><path d="M480.0,100 V135.0 H750.0 V170"/><path d="M210.0,250 V295.0 H210.0 V340"/><path d="M210.0,420 V465.0 H205.0 V510"/><path d="M360,380.0 H575"/><path d="M750.0,250 V295.0 H750.0 V340"/><path d="M750.0,420 V465.0 H750.0 V510"/><path d="M750.0,590 V635.0 H750.0 V680"/><path d="M750.0,760 V805.0 H515.0 V850"/><path d="M515.0,930 V975.0 H515.0 V1020"/></g><g class="node" tabindex="0" role="button" data-node="run" onclick="inspect('run')" onkeydown="if(event.key==='Enter')inspect('run')"><rect x="335" y="30" width="290" height="70" rx="13" fill="#ebe7fa" stroke="#d6cfea"/><text x="480.0" y="59" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">运行中的 TaskRun</text><text x="480.0" y="82" font-size="10" text-anchor="middle" fill="#7a738a">项目 / 输入 / 已确认方案 / 检查点</text></g><g class="node" tabindex="0" role="button" data-node="api" onclick="inspect('api')" onkeydown="if(event.key==='Enter')inspect('api')"><rect x="60" y="170" width="300" height="80" rx="13" fill="#e8f4ee" stroke="#d6cfea"/><text x="210.0" y="199" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">API请求级故障</text><text x="210.0" y="222" font-size="10" text-anchor="middle" fill="#7a738a">429 / 可重试5xx / 连接或断流</text></g><g class="node" tabindex="0" role="button" data-node="business" onclick="inspect('business')" onkeydown="if(event.key==='Enter')inspect('business')"><rect x="600" y="170" width="300" height="80" rx="13" fill="#e9f1fb" stroke="#d6cfea"/><text x="750.0" y="199" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">业务 / 工具 / 质量失败</text><text x="750.0" y="222" font-size="10" text-anchor="middle" fill="#7a738a">缺文件 / 漏译 / 编译或求解错误</text></g><g class="node" tabindex="0" role="button" data-node="budget" onclick="inspect('budget')" onkeydown="if(event.key==='Enter')inspect('budget')"><rect x="60" y="340" width="300" height="80" rx="13" fill="#fff1e5" stroke="#d6cfea"/><text x="210.0" y="369" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">一个重试预算拥有者</text><text x="210.0" y="392" font-size="10" text-anchor="middle" fill="#7a738a">示例：总3次 / 90秒 / 同能力渠道</text></g><g class="node" tabindex="0" role="button" data-node="success" onclick="inspect('success')" onkeydown="if(event.key==='Enter')inspect('success')"><rect x="40" y="510" width="330" height="80" rx="13" fill="#ebe7fa" stroke="#d6cfea"/><text x="205.0" y="539" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">完整响应 + 去重核验</text><text x="205.0" y="562" font-size="10" text-anchor="middle" fill="#7a738a">校验后提交一次，原任务继续</text></g><g class="node" tabindex="0" role="button" data-node="failure" onclick="inspect('failure')" onkeydown="if(event.key==='Enter')inspect('failure')"><rect x="575" y="340" width="350" height="80" rx="13" fill="#e8f4ee" stroke="#d6cfea"/><text x="750.0" y="369" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">失败现场 + 依赖隔离</text><text x="750.0" y="392" font-size="10" text-anchor="middle" fill="#7a738a">业务立即 / API预算耗尽后</text></g><g class="node" tabindex="0" role="button" data-node="notify" onclick="inspect('notify')" onkeydown="if(event.key==='Enter')inspect('notify')"><rect x="575" y="510" width="350" height="80" rx="13" fill="#e9f1fb" stroke="#d6cfea"/><text x="750.0" y="539" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">本机待处理 + 手机通知</text><text x="750.0" y="562" font-size="10" text-anchor="middle" fill="#7a738a">提交 / 服务接受 / 投递失败 / 已查看</text></g><g class="node" tabindex="0" role="button" data-node="human" onclick="inspect('human')" onkeydown="if(event.key==='Enter')inspect('human')"><rect x="575" y="680" width="350" height="80" rx="13" fill="#fff1e5" stroke="#d6cfea"/><text x="750.0" y="709" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">用户处理、记录原因与决定</text><text x="750.0" y="732" font-size="10" text-anchor="middle" fill="#7a738a">修复渠道 / 补资料 / 调整工具或方案</text></g><g class="node" tabindex="0" role="button" data-node="verify" onclick="inspect('verify')" onkeydown="if(event.key==='Enter')inspect('verify')"><rect x="335" y="850" width="360" height="80" rx="13" fill="#ebe7fa" stroke="#d6cfea"/><text x="515.0" y="879" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">检查点、版本、依赖与锁复核</text><text x="515.0" y="902" font-size="10" text-anchor="middle" fill="#7a738a">重启先查外部进程；能力需已验证</text></g><g class="node" tabindex="0" role="button" data-node="resume" onclick="inspect('resume')" onkeydown="if(event.key==='Enter')inspect('resume')"><rect x="335" y="1020" width="360" height="80" rx="13" fill="#e8f4ee" stroke="#d6cfea"/><text x="515.0" y="1049" font-size="13" font-weight="600" text-anchor="middle" fill="#39344e">最小有效节点恢复</text><text x="515.0" y="1072" font-size="10" text-anchor="middle" fill="#7a738a">旧失败、旧成果、旧验收永久保留</text></g></svg>